services:
  cli:
    # Remove platform specification to use native architecture
    build:
      context: .
      dockerfile: Dockerfile.cli
    volumes:
      - ./data:/app/data
    stdin_open: true
    tty: true

  web:
    # Remove platform specification to use native architecture  
    build:
      context: .
      dockerfile: Dockerfile.web
    volumes:
      - ./data:/app/data
    ports:
      - "5001:5000"
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    restart: unless-stopped